<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Login & Sign In - KisanBulletin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary-green: #689f38;
            --dark-green: #497223;
            --govt-blue: #0284c7;
            --govt-dark-blue: #0369a1;
            --accent-yellow: #ffeb3b;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --error-red: #ef4444;
            --success-green: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .lang-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 6px;
            background: #ffffff;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: #f8fafc;
        }

        .lang-btn.active {
            background: var(--primary-green);
            color: #ffffff;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation span {
            position: absolute;
            bottom: -60px;
            font-size: 30px;
            opacity: 0.15;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.75; }
            90% { opacity: 0.75; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .bg-animation span:nth-child(1) { left: 10%; animation-duration: 18s; animation-delay: 0s; font-size: 45px; }
        .bg-animation span:nth-child(2) { left: 25%; animation-duration: 22s; animation-delay: 4s; font-size: 35px; }
        .bg-animation span:nth-child(3) { left: 40%; animation-duration: 16s; animation-delay: 1s; font-size: 50px; }
        .bg-animation span:nth-child(4) { left: 60%; animation-duration: 25s; animation-delay: 8s; font-size: 40px; }
        .bg-animation span:nth-child(5) { left: 75%; animation-duration: 19s; animation-delay: 3s; font-size: 38px; }
        .bg-animation span:nth-child(6) { left: 90%; animation-duration: 21s; animation-delay: 6s; font-size: 42px; }
        .bg-animation span:nth-child(7) { left: 15%; animation-duration: 24s; animation-delay: 12s; font-size: 35px; }
        .bg-animation span:nth-child(8) { left: 35%; animation-duration: 17s; animation-delay: 9s; font-size: 48px; }
        .bg-animation span:nth-child(9) { left: 65%; animation-duration: 20s; animation-delay: 5s; font-size: 39px; }
        .bg-animation span:nth-child(10) { left: 85%; animation-duration: 23s; animation-delay: 2s; font-size: 44px; }
        .bg-animation span:nth-child(11) { left: 5%; animation-duration: 20s; animation-delay: 7s; font-size: 37px; }
        .bg-animation span:nth-child(12) { left: 50%; animation-duration: 18s; animation-delay: 10s; font-size: 46px; }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
            z-index: 10; 
        }

        .auth-header {
            background: var(--primary-green);
            padding: 28px 24px 20px;
            text-align: center;
            color: #ffffff;
            transition: background 0.3s ease;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .brand-logo span {
            color: var(--accent-yellow);
        }

        .auth-header p {
            font-size: 13px;
            margin-top: 6px;
            opacity: 0.9;
        }

        .tab-switcher {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .tab-btn.active {
            color: var(--dark-green);
            background: #ffffff;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary-green);
        }

        .auth-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.prefix-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #ffffff;
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(104, 159, 56, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
        }

        .phone-group {
            display: flex;
            gap: 8px;
        }

        .country-code {
            width: 75px;
            padding: 10px 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            background: #f8fafc;
            text-align: center;
            color: var(--text-dark);
        }

        .phone-group input {
            padding-left: 14px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--dark-green);
        }

        .alert-box {
            display: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .alert-error {
            background: #fef2f2;
            color: var(--error-red);
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #f0fdf4;
            color: var(--success-green);
            border: 1px solid #bbf7d0;
        }

        .demo-credentials-box {
            margin-top: 20px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 12px;
        }

        .demo-credentials-box h4 {
            font-size: 12px;
            color: var(--text-dark);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .demo-user-pill {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-quick-fill {
            background: #eef7e8;
            color: var(--dark-green);
            border: 1px solid #c9e7b8;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-quick-fill:hover {
            background: var(--primary-green);
            color: #fff;
        }

        .btn-quick-fill.govt {
            background: #e0f2fe;
            color: var(--govt-dark-blue);
            border-color: #bae6fd;
        }

        .btn-quick-fill.govt:hover {
            background: var(--govt-blue);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="lang-selector">
        <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
        <button class="lang-btn" data-lang="te" onclick="setLanguage('te')">తెలుగు</button>
    </div>

    <div class="bg-animation">
        <span>🥕</span>
        <span>🍅</span>
        <span>🥦</span>
        <span>🥔</span>
        <span>🧅</span>
        <span>🌽</span>
        <span>🍆</span>
        <span>🥬</span>
        <span>🧄</span>
        <span>🌶️</span>
        <span>🥒</span>
        <span>🍠</span>
    </div>

    <div class="auth-container">
        
        <div class="auth-header" id="authHeader">
            <div class="brand-logo">
                <i class="fa-solid fa-leaf"></i> Kisan<span>Bulletin</span>
            </div>
            <p data-i18n="subtitle">Agri Intelligence, Mandi Forecasting & Govt Control</p>
        </div>

        <div class="tab-switcher">
            <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">
                <i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="tab_login">Login</span>
            </button>
            <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">
                <i class="fa-solid fa-user-plus"></i> <span data-i18n="tab_signup">Sign In with Phone</span>
            </button>
        </div>

        <div class="auth-body">
            
            <div class="alert-box alert-error" id="errorAlert"></div>
            <div class="alert-box alert-success" id="successAlert"></div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="loginUsername" data-i18n="lbl_username">Username or Registered Phone</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user prefix-icon"></i>
                        <input type="text" id="loginUsername" data-i18n-ph="ph_username" placeholder="e.g. farmer_ramesh or 9876543210" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword" data-i18n="lbl_password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock prefix-icon"></i>
                        <input type="password" id="loginPassword" data-i18n-ph="ph_password" placeholder="Enter password" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked> <span data-i18n="lbl_remember">Remember Me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="handleForgot()" data-i18n="lbl_forgot">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fa-solid fa-arrow-right"></i> <span data-i18n="btn_login">Login to Portal</span>
                </button>
            </form>

            <form id="signupForm" style="display: none;" onsubmit="handleSignupSubmit(event)">
                <div class="form-group">
                    <label for="regName" data-i18n="lbl_name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card prefix-icon"></i>
                        <input type="text" id="regName" data-i18n-ph="ph_name" placeholder="e.g. Ramesh Kumar" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPhone" data-i18n="lbl_phone">Mobile Number (for SMS & Mandi Alerts)</label>
                    <div class="phone-group">
                        <input type="text" class="country-code" value="+91 🇮🇳" readonly>
                        <div class="input-wrapper" style="flex: 1;">
                            <i class="fa-solid fa-phone prefix-icon"></i>
                            <input type="tel" id="regPhone" data-i18n-ph="ph_phone" placeholder="10-digit mobile number" maxlength="10" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regState" data-i18n="lbl_state">Primary APMC Region / State</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-location-dot prefix-icon"></i>
                        <select id="regState" required>
                            <option value="" data-i18n="opt_state_default">Select State / Mandi Hub</option>
                            <option value="Telangana" data-i18n="opt_ts" selected>Telangana (Warangal / Nizamabad / Hyderabad)</option>
                            <option value="Andhra Pradesh" data-i18n="opt_ap">Andhra Pradesh (Guntur / Vijayawada)</option>
                            <option value="Maharashtra" data-i18n="opt_mh">Maharashtra (Nashik / Nagpur)</option>
                            <option value="Karnataka" data-i18n="opt_ka">Karnataka (Bangalore / Hubli)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword" data-i18n="lbl_create_pass">Create Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock prefix-icon"></i>
                        <input type="password" id="regPassword" data-i18n-ph="ph_create_pass" placeholder="Minimum 6 characters" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('regPassword', this)"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-check"></i> <span data-i18n="btn_register">Register & Send OTP</span>
                </button>
            </form>

            <!-- One-Click Demo Credentials (Farmer vs Govt) -->
            <div class="demo-credentials-box" id="demoHelper">
                <h4>
                    <span><i class="fa-solid fa-key" style="color: #689f38;"></i> <span data-i18n="lbl_demo_title">Demo Credentials</span></span>
                    <span style="font-size: 10px; color: #64748b;" data-i18n="lbl_demo_sub">(Click auto fill)</span>
                </h4>

                <!-- Farmer Login -->
                <div class="demo-user-pill">
                    <div>
                        <span style="font-size: 10.5px; font-weight: 800; color: #16a34a;" data-i18n="lbl_demo_farmer">🌾 Public / Farmer:</span><br>
                        <b>xavier_123</b> / <code>kisan123</code>
                    </div>
                    <button class="btn-quick-fill" onclick="quickFill('farmer', 'xavier_123', 'kisan123')" data-i18n="btn_autofill">Auto Fill</button>
                </div>

                <!-- Government Officer Login -->
                <div class="demo-user-pill">
                    <div>
                        <span style="font-size: 10.5px; font-weight: 800; color: #0284c7;" data-i18n="lbl_demo_govt">🏛️ Government Officer (APMC):</span><br>
                        <b>govt_officer</b> / <code>admin123</code>
                    </div>
                    <button class="btn-quick-fill govt" onclick="quickFill('govt', 'govt_officer', 'admin123')" data-i18n="btn_autofill_govt">Auto Fill (Govt)</button>
                </div>
            </div>

        </div>
    </div>

        const DUMMY_ACCOUNTS = [
            { username: "xavier_123", phone: "9876543210", password: "kisan123", role: "farmer", name: "Xavier (Farmer)" },
            { username: "farmer_ramesh", phone: "9876543211", password: "kisan123", role: "farmer", name: "Ramesh Kumar (Farmer)" },
            { username: "govt_officer", phone: "9111122222", password: "admin123", role: "govt", name: "Dr. K. V. Rao (APMC Director)" }
        ];

        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                }
            });
            applyTranslation();
        }

        function applyTranslation() {
            document.title = translations[currentLang]['page_title'];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerHTML = translations[currentLang][key];
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (translations[currentLang][key]) {
                    el.placeholder = translations[currentLang][key];
                }
            });
            hideAlerts();
        }

        function handleForgot() {
            alert(translations[currentLang].alert_forgot);
        }

        function switchTab(tabName) {
            hideAlerts();
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');
            const demoHelper = document.getElementById('demoHelper');

            if (tabName === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                loginTabBtn.classList.add('active');
                signupTabBtn.classList.remove('active');
                demoHelper.style.display = 'block';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                loginTabBtn.classList.remove('active');
                signupTabBtn.classList.add('active');
                demoHelper.style.display = 'none';
            }
        }

        function quickFill(role, user, pass) {
            switchTab('login');
            document.getElementById('loginUsername').value = user;
            document.getElementById('loginPassword').value = pass;
            
            // Visual header color change
            const header = document.getElementById('authHeader');
            const submitBtn = document.getElementById('submitBtn');
            if (role === 'govt') {
                header.style.background = 'var(--govt-blue)';
                submitBtn.style.background = 'var(--govt-blue)';
            } else {
                header.style.background = 'var(--primary-green)';
                submitBtn.style.background = 'var(--primary-green)';
            }

            hideAlerts();
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            hideAlerts();

            const userInput = document.getElementById('loginUsername').value.trim();
            const passInput = document.getElementById('loginPassword').value;

            const matchedUser = DUMMY_ACCOUNTS.find(acc => 
                (acc.username.toLowerCase() === userInput.toLowerCase() || acc.phone === userInput) && 
                acc.password === passInput
            );

            if (matchedUser) {
                const userRole = matchedUser.role || 'farmer';
                
                // Save role and name to localStorage
                localStorage.setItem('kisanUserRole', userRole);
                localStorage.setItem('kisanUserName', matchedUser.name);

                let welcomeMsg = userRole === 'govt' 
                    ? translations[currentLang].msg_welcome_govt 
                    : translations[currentLang].msg_welcome_farmer;

                showSuccess(welcomeMsg.replace('{name}', matchedUser.name));

                setTimeout(() => {
                    // Redirect with role parameter to load specific portal theme
                    window.location.href = `/home?role=${userRole}`;
                }, 1000);
            } else {
                showError(translations[currentLang].alert_invalid);
            }
        }

        function handleSignupSubmit(event) {
            event.preventDefault();
            hideAlerts();

            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPassword').value;

            if (phone.length < 10 || isNaN(phone)) {
                showError(translations[currentLang].alert_phone_err);
                return;
            }

            DUMMY_ACCOUNTS.push({ 
                username: name.toLowerCase().replace(/\s+/g, '_'), 
                phone: phone, 
                password: pass, 
                role: 'farmer',
                name: name 
            });

            localStorage.setItem('kisanUserRole', 'farmer');
            localStorage.setItem('kisanUserName', name);

            const msg = translations[currentLang].msg_registered.replace('{name}', name);
            showSuccess(msg);
            setTimeout(() => {
                window.location.href = "/home?role=farmer";
            }, 1200);
        }

        function showError(msg) {
            const err = document.getElementById('errorAlert');
            err.innerText = msg;
            err.style.display = 'block';
        }

        function showSuccess(msg) {
            const succ = document.getElementById('successAlert');
            succ.innerText = msg;
            succ.style.display = 'block';
        }

        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }
    </script>
